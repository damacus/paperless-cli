[package]
name = "paperless-cli"
version = "2.1.4"
edition = "2021"
description = "Rust TUI and LLM-friendly client for Paperless-ngx"
license = "MIT"
repository = "https://github.com/damacus/paperless-cli"
homepage = "https://github.com/damacus/paperless-cli"
readme = "README.md"
keywords = ["paperless", "paperless-ngx", "tui", "cli", "documents"]
categories = ["command-line-utilities"]

[[bin]]
name = "paperless"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
mime_guess = "2.0.5"
lopdf = "0.44.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "multipart", "query", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "1.1.2"
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
httpmock = "0.8.3"
predicates = "3.1.4"
tempfile = "3.27.0"
